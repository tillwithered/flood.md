name: Release

on:
  workflow_dispatch:
    inputs:
      skip_checks:
        description: "Explicitly authorized hotfix: build without running tests"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !inputs.skip_checks }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful main CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in $(seq 1 120); do
            runs=$(gh run list --workflow ci.yml --branch main --commit "$RELEASE_SHA" --limit 20 --json status,conclusion)
            if echo "$runs" | jq -e 'any(.[]; .conclusion == "success")' > /dev/null; then exit 0; fi
            if echo "$runs" | jq -e 'length > 0 and all(.[]; .status == "completed")' > /dev/null; then
              echo "CI failed for the release commit; refusing to publish."
              exit 1
            fi
            sleep 15
          done
          echo "No successful main CI for the release commit within 30 minutes."
          exit 1
  publish:
    needs: verify
    if: ${{ !cancelled() && (needs.verify.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_checks)) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          cache-workspace-crates: true
      - run: npm ci
      - name: Validate protected release credentials
        shell: pwsh
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          FLOOD_GITHUB_CLIENT_ID: ${{ vars.FLOOD_GITHUB_CLIENT_ID }}
          FLOOD_GITHUB_APP_SLUG: ${{ vars.FLOOD_GITHUB_APP_SLUG }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TG_API_ID) -or [string]::IsNullOrWhiteSpace($env:TG_API_HASH) -or [string]::IsNullOrWhiteSpace($env:FLOOD_GITHUB_CLIENT_ID) -or [string]::IsNullOrWhiteSpace($env:FLOOD_GITHUB_APP_SLUG) -or [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Required release secrets are not configured"
          }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          FLOOD_GITHUB_CLIENT_ID: ${{ vars.FLOOD_GITHUB_CLIENT_ID }}
          FLOOD_GITHUB_APP_SLUG: ${{ vars.FLOOD_GITHUB_APP_SLUG }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "flood.md ${{ github.ref_name }}"
          releaseBody: |
            Dark desktop workspace with a simplified project flow, floating task summary and command dock.

            Connect an installed Codex CLI, sign in with ChatGPT when needed, and choose an existing conversation by name. New conversations must first be started in Codex.

            Полное описание изменений — в CHANGELOG.md для этой версии.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
