name: Release candidate dry run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate release contract after clean-main source gate
        shell: pwsh
        run: |
          npm ci
          pwsh -NoProfile -File scripts/verify-release-contract.ps1
      - name: Build signed release-candidate bundle without publishing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          FLOOD_GITHUB_CLIENT_ID: ${{ vars.FLOOD_GITHUB_CLIENT_ID }}
          FLOOD_GITHUB_APP_SLUG: ${{ vars.FLOOD_GITHUB_APP_SLUG }}
        run: npm run tauri build
      - name: Verify clean installer and updater artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $current = Get-ChildItem target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          $signature = Get-ChildItem target/release/bundle/nsis -Filter "*.sig" | Select-Object -First 1
          if (-not $current -or -not $signature -or $signature.Length -lt 1) { throw "Signed RC artifacts are incomplete" }
          $artifact = Get-Item ($signature.FullName -replace '\.sig$', '')
          node scripts/verify-updater-signature.mjs $artifact.FullName $signature.FullName
          if ($LASTEXITCODE -ne 0) { throw "Updater signature verification failed" }
          $previousDir = Join-Path $PWD "target/previous-stable"
          New-Item -ItemType Directory -Force -Path $previousDir | Out-Null
          gh release download --repo tillwithered/flood.md --pattern "*-setup.exe" --dir $previousDir
          if ($LASTEXITCODE -ne 0) { throw "Could not download the latest public stable installer" }
          $previous = Get-ChildItem $previousDir -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $previous) { throw "The latest public stable release has no Windows installer" }
          pwsh -NoProfile -File scripts/verify-windows-install-upgrade.ps1 -PreviousInstaller $previous.FullName -CurrentInstaller $current.FullName -ExpectedVersion ((Get-Content package.json -Raw | ConvertFrom-Json).version)
      - uses: actions/upload-artifact@v6
        with:
          name: flood-release-candidate-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*.sig
            target/stable-verification/evidence.json
          if-no-files-found: error
