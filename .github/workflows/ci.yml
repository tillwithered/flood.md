name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      gate_only: ${{ steps.scope.outputs.gate_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fail early on release-train drift
        run: node scripts/release.mjs --source-only
      - name: Classify publication-only changes
        id: scope
        run: node scripts/ci-scope.mjs
      - name: Select affected component consumers
        run: node scripts/ci-affected.mjs
      - run: npm run verify
        if: steps.scope.outputs.gate_only != 'true'
      - name: Verify publication-only website
        if: steps.scope.outputs.gate_only == 'true'
        run: npm run build && npm run check && npm test && npm run site:check
      - run: npm run release:check
      - name: Pack immutable release candidate
        if: github.event_name == 'push' && steps.scope.outputs.gate_only != 'true'
        run: npm run ci:candidate
      - name: Prepare verified website runtime
        id: website
        run: npm run site:bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: website-runtime-${{ github.sha }}
          path: ${{ steps.website.outputs.directory }}
          overwrite: true
          retention-days: 14
          if-no-files-found: error
      - name: Bundle build outputs once for browser workers
        shell: bash
        run: |
          paths=(packages/react/dist packages/tokens/dist apps/website/dist .artifacts/ci-plan.json)
          if [ -d examples/next/.next ]; then paths+=(examples/next/.next); fi
          tar --exclude='examples/next/.next/cache' -czf .artifacts/browser-build.tgz "${paths[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-build-${{ github.sha }}
          path: .artifacts/browser-build.tgz
          compression-level: 0
          overwrite: true
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && steps.scope.outputs.gate_only != 'true'
        with:
          name: candidate-bytes-${{ github.sha }}
          path: .artifacts/release-candidate
          overwrite: true
          retention-days: 14
          if-no-files-found: error
  chromium:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: browser-build-${{ github.sha }}
          path: .artifacts
      - run: tar -xzf .artifacts/browser-build.tgz
      - name: Browser behavior and styles
        run: node scripts/ci-browser.mjs chromium ${{ matrix.shard }}/4
        env:
          FLOOD_PUBLICATION_ONLY: ${{ needs.build.outputs.gate_only }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: chromium-${{ matrix.shard }}-results
          path: |
            playwright-report
            test-results
          overwrite: true
          retention-days: 7
  browser-engines:
    needs: build
    if: needs.build.outputs.gate_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: browser-build-${{ github.sha }}
          path: .artifacts
      - run: tar -xzf .artifacts/browser-build.tgz
      - name: Match the mounted browser profile directory to the container user
        run: chown "$(id -u):$(id -g)" /github/home
      - run: node scripts/ci-browser.mjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.engine }}-results
          path: |
            .artifacts/browser-engines.json
            test-results
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
  verify:
    if: always()
    needs: [build, chromium, browser-engines]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable gate
        env:
          BUILD: ${{ needs.build.result }}
          CHROMIUM: ${{ needs.chromium.result }}
          ENGINES: ${{ needs.browser-engines.result }}
          GATE_ONLY: ${{ needs.build.outputs.gate_only }}
        run: |
          test "$BUILD" = success
          test "$CHROMIUM" = success
          if [ "$GATE_ONLY" = true ]; then test "$ENGINES" = skipped; else test "$ENGINES" = success; fi
