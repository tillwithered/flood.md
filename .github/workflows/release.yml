name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run check
      - name: Validate protected release credentials
        shell: pwsh
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TG_API_ID) -or [string]::IsNullOrWhiteSpace($env:TG_API_HASH) -or [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Required release secrets are not configured"
          }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "flood.md ${{ github.ref_name }}"
          releaseBody: |
            ## flood.md ${{ github.ref_name }}

            A major local-first workflow update: Telegram inbox triage, media-aware task sources, bounded and confirmable MCP workflows, operational diagnostics, safer storage, and a more spacious settings experience.

            Большое обновление локального рабочего процесса: разбор входящих Telegram и медиа, ограниченные и подтверждаемые MCP-сценарии, диагностика, усиленная сохранность данных и более просторные настройки.

            ### Highlights

            - Bounded Telegram inbox with search, albums, media, drafts, undo, multi-select, and history.
            - MCP workspace brief, search, priority digest, confirmed Telegram triage, readiness checks, and metadata-only activity history.
            - Retry-safe project and task creation with mandatory idempotency keys.
            - Expanded Settings, enforced 12 px minimum text, improved installation/update diagnostics, and hardened local storage.

            Full details: [CHANGELOG.md](https://github.com/tillwithered/flood.md/blob/${{ github.ref_name }}/CHANGELOG.md).
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
