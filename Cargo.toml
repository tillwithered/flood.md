[workspace]
resolver = "2"
members = ["crates/flood-core", "crates/flood-github", "crates/flood-mcp", "src-tauri"]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
anyhow = "1.0.100"
atomic-write-file = "0.3.1"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
fs2 = "0.4.3"
hex = "0.4.3"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "query", "rustls"] }
rmcp = { version = "3.2.0", features = ["server", "transport-io"] }
schemars = { version = "1.0.4", features = ["chrono04"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
tdlib = { package = "tdlib-rs", version = "1.4.0", features = ["download-tdlib", "static"] }
ulid = { version = "1.2.1", features = ["serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
