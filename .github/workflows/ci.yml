name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Stable verification gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-stable.ps1
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stable-verification-${{ github.sha }}
          path: target/stable-verification/evidence.json
          if-no-files-found: warn
