name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CI_NODE_VERSION: '24.16.0'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      browser_reused: ${{ steps.browser.outputs.reused }}
      coverage: ${{ steps.affected.outputs.coverage }}
      chromium_jobs: ${{ steps.affected.outputs.chromium_jobs }}
      engine_shards: ${{ steps.affected.outputs.engine_shards }}
      engine_total: ${{ steps.affected.outputs.engine_total }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fail early on release-train drift
        run: node scripts/release.mjs --source-only
      - name: Classify verification scope
        id: scope
        run: node scripts/ci-scope.mjs
      - name: Select affected component consumers
        id: affected
        run: node scripts/ci-affected.mjs
        env:
          FLOOD_CI_SCOPE: ${{ steps.scope.outputs.scope }}
      - name: Look up browser verification for the exact merge
        id: browser
        run: node scripts/ci-browser-reuse.mjs lookup
        env:
          FLOOD_CI_SCOPE: ${{ steps.scope.outputs.scope }}
          FLOOD_CI_COVERAGE: ${{ steps.affected.outputs.coverage }}
          GITHUB_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
      - run: npm run verify
        if: steps.scope.outputs.scope == 'full'
      - name: Verify website build and contracts
        if: contains(fromJSON('["publication","integration"]'), steps.scope.outputs.scope)
        run: npm run build && npm run check && npm test
      - run: npm run release:check
      - name: Pack immutable release candidate
        if: github.event_name == 'push' && steps.scope.outputs.scope == 'full' && steps.affected.outputs.full_coverage == 'true'
        run: npm run ci:candidate
      - name: Prepare verified website runtime
        id: website
        run: npm run site:bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: website-runtime-${{ github.sha }}
          path: ${{ steps.website.outputs.directory }}
          overwrite: true
          retention-days: 14
          if-no-files-found: error
      - name: Bundle build outputs once for browser workers
        if: steps.browser.outputs.reused != 'true' || (github.event_name == 'push' && steps.scope.outputs.scope == 'full' && steps.affected.outputs.full_coverage == 'true')
        shell: bash
        run: |
          paths=(packages/react/dist packages/tokens/dist apps/website/dist apps/website/dist-server .artifacts/ci-plan.json)
          if [ -d .artifacts/agent-consumer ]; then paths+=(.artifacts/agent-consumer); fi
          if [ -d examples/next/.next ]; then paths+=(examples/next/.next); fi
          tar --exclude='examples/next/.next/cache' -czf .artifacts/browser-build.tgz "${paths[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.browser.outputs.reused != 'true' || (github.event_name == 'push' && steps.scope.outputs.scope == 'full' && steps.affected.outputs.full_coverage == 'true')
        with:
          name: browser-build-${{ github.sha }}
          path: .artifacts/browser-build.tgz
          compression-level: 0
          overwrite: true
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && steps.scope.outputs.scope == 'full' && steps.affected.outputs.full_coverage == 'true'
        with:
          name: candidate-bytes-${{ github.sha }}
          path: .artifacts/release-candidate
          overwrite: true
          retention-days: 14
          if-no-files-found: error
  chromium:
    needs: build
    if: needs.build.outputs.browser_reused != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.chromium_jobs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: browser-build-${{ github.sha }}
          path: .artifacts
      - run: tar -xzf .artifacts/browser-build.tgz
      - name: Browser behavior and styles
        run: node scripts/ci-browser.mjs chromium ${{ matrix.shard }}/${{ matrix.total }}
        env:
          FLOOD_CI_SCOPE: ${{ needs.build.outputs.scope }}
          FLOOD_CHROMIUM_LANE: ${{ matrix.lane }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: chromium-${{ matrix.lane }}-${{ matrix.shard }}-results
          path: |
            playwright-report
            test-results
          overwrite: true
          retention-days: 7
  browser-engines:
    needs: build
    if: needs.build.outputs.scope == 'full' && needs.build.outputs.browser_reused != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
        shard: ${{ fromJSON(needs.build.outputs.engine_shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: browser-build-${{ github.sha }}
          path: .artifacts
      - run: tar -xzf .artifacts/browser-build.tgz
      - name: Match the mounted browser profile directory to the container user
        run: chown "$(id -u):$(id -g)" /github/home
      - run: node scripts/ci-browser.mjs ${{ matrix.engine }} ${{ matrix.shard }}/${{ needs.build.outputs.engine_total }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.engine }}-${{ matrix.shard }}-results
          path: |
            .artifacts/browser-engines.json
            test-results
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
  verify:
    if: always()
    needs: [build, chromium, browser-engines]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable gate
        env:
          BUILD: ${{ needs.build.result }}
          CHROMIUM: ${{ needs.chromium.result }}
          ENGINES: ${{ needs.browser-engines.result }}
          SCOPE: ${{ needs.build.outputs.scope }}
          REUSED: ${{ needs.build.outputs.browser_reused }}
        run: |
          test "$BUILD" = success
          if [ "$REUSED" = true ]; then
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/main
            case "$SCOPE" in full|publication|integration) ;; *) exit 1 ;; esac
            test "$CHROMIUM" = skipped
            test "$ENGINES" = skipped
            exit 0
          fi
          test "$REUSED" = false
          test "$CHROMIUM" = success
          case "$SCOPE" in
            full) test "$ENGINES" = success ;;
            publication|integration) test "$ENGINES" = skipped ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: github.event_name == 'pull_request'
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
      - name: Record the successful browser coverage
        if: github.event_name == 'pull_request'
        env:
          FLOOD_CI_SCOPE: ${{ needs.build.outputs.scope }}
          FLOOD_CI_COVERAGE: ${{ needs.build.outputs.coverage }}
        run: node scripts/ci-browser-reuse.mjs record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'pull_request'
        with:
          name: browser-verification-${{ github.run_attempt }}
          path: .artifacts/browser-verification.json
          if-no-files-found: error
          retention-days: 14
