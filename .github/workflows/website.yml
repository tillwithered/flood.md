name: Verify website deployment
on:
  deployment_status:
permissions:
  contents: read
  actions: read
concurrency:
  group: website-verification
  cancel-in-progress: true
jobs:
  deployed-source:
    if: >-
      github.repository == 'tillwithered/flood.md' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'npm-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Require successful main CI for the deployed source
        run: node scripts/ci-candidate-run.mjs --site
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify actual public contracts after Railway rollout
        run: node scripts/site-contract.mjs wait
        env:
          WEBSITE_URL: ${{ vars.WEBSITE_URL || 'https://flood.md' }}
          EXPECTED_COMMIT: ${{ github.event.deployment.sha }}
          VERIFY_TIMEOUT_MS: 120000
