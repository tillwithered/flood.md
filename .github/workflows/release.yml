name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Stable verification gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-stable.ps1
      - name: Validate release version and updater contract
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-release-contract.ps1 -ExpectedTag "${{ github.ref_name }}"
      - name: Validate protected release credentials
        shell: pwsh
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          FLOOD_GITHUB_CLIENT_ID: ${{ vars.FLOOD_GITHUB_CLIENT_ID }}
          FLOOD_GITHUB_APP_SLUG: ${{ vars.FLOOD_GITHUB_APP_SLUG }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TG_API_ID) -or [string]::IsNullOrWhiteSpace($env:TG_API_HASH) -or [string]::IsNullOrWhiteSpace($env:FLOOD_GITHUB_CLIENT_ID) -or [string]::IsNullOrWhiteSpace($env:FLOOD_GITHUB_APP_SLUG) -or [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Required release secrets are not configured"
          }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          FLOOD_GITHUB_CLIENT_ID: ${{ vars.FLOOD_GITHUB_CLIENT_ID }}
          FLOOD_GITHUB_APP_SLUG: ${{ vars.FLOOD_GITHUB_APP_SLUG }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "flood.md ${{ github.ref_name }}"
          releaseBody: |
            ## flood.md ${{ github.ref_name }}

            Stable flood.md hotfix release: a local-first task workspace where an MCP agent can review bounded Telegram discussions, inspect attached images and permitted project context, and create concise prioritized tasks.

            Стабильный hotfix-релиз flood.md: локальный задачник, в котором MCP-агент может разобрать ограниченный контекст Telegram, посмотреть приложенные изображения и разрешённый контекст проекта, а затем создать компактные задачи с приоритетами.

            ### Highlights

            - Fixed the Windows release-only crash after Telegram two-factor authentication while preserving the existing local session and data.
            - Local Markdown tasks with conflict-safe editing, attachments, urgency, completion, trash, backup, and recovery.
            - Telegram through TDLib: linked chats, mentions and replies, albums, media, human-sized context windows, inbox triage, and duplicate-safe task creation.
            - Read-only GitHub App connector with repository selection and bounded MCP access to files, search, README, issues, and pull requests.
            - MCP workflows for project/task management, project-aware Telegram triage, image inspection, task execution context, confirmation-safe writes, and diagnostics.
            - Refined light/dark desktop UI, 720 px reading zones, accessible 12 px minimum text, and clear source/media views.

            Full details: [CHANGELOG.md](https://github.com/tillwithered/flood.md/blob/${{ github.ref_name }}/CHANGELOG.md).
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
      - name: Verify clean install and upgrade from latest public stable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $current = Get-ChildItem target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $current) { throw "Current NSIS installer was not produced" }
          New-Item -ItemType Directory -Force target/previous-stable | Out-Null
          gh release download --repo tillwithered/flood.md --pattern "*-setup.exe" --dir target/previous-stable --clobber
          $previous = Get-ChildItem target/previous-stable -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $previous) { throw "Previous public stable installer was not found" }
          $expected = "${{ github.ref_name }}".TrimStart("v")
          pwsh -NoProfile -File scripts/verify-windows-install-upgrade.ps1 -CurrentInstaller $current.FullName -PreviousInstaller $previous.FullName -ExpectedVersion $expected
      - name: Verify updater artifacts and publish the validated draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $signature = Get-ChildItem target/release/bundle/nsis -Filter "*.sig" | Select-Object -First 1
          if (-not $signature -or $signature.Length -lt 1) { throw "Updater signature was not produced" }
          $artifact = Get-Item ($signature.FullName -replace '\.sig$', '')
          node scripts/verify-updater-signature.mjs $artifact.FullName $signature.FullName
          $assets = @(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name')
          if (-not ($assets -contains "latest.json") -or -not ($assets | Where-Object { $_ -match '\.sig$' })) { throw "Release is missing updater metadata or signature" }
          gh release edit "${{ github.ref_name }}" --draft=false
